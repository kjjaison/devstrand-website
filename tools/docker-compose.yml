services:
  tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: devstrand-tools:local
    # Local browser only (loopback, unprivileged). Public traffic is
    # Cloudflare Tunnel over toolsnet — not this host port.
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_COMPRESS_MB: "100"
      TOOLS_TMP: /tmp/devstrand-tools
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      EMAIL_MAX_MB: ${EMAIL_MAX_MB:-20}
      SHARE_MAX_MB: ${SHARE_MAX_MB:-50}
      SHARE_RATE_LIMIT: ${SHARE_RATE_LIMIT:-20}
    volumes:
      - ./frontend:/app/frontend:ro
      - ./backend:/app/backend:ro
    restart: unless-stopped
    networks:
      - toolsnet

  # Exposes tools.devstrand.com / pdf.devstrand.com without a static IP
  # or open ports. Requires CLOUDFLARE_TUNNEL_TOKEN in tools/.env
  #
  # Cloudflare Published application Service URLs (HTTP):
  #   tools.devstrand.com + pdf.devstrand.com → http://tools:8080
  #   expensetracker.devstrand.com            → http://nginx:80
  # cloudflared must stay on this compose file (toolsnet) so it can
  # resolve `tools`. It is also attached to expense-tracker_default
  # so it can resolve `nginx`. Do not use host.docker.internal, :80,
  # or :8080 on the host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in tools/.env}
    depends_on:
      - tools
    networks:
      - toolsnet
      - expense-tracker

networks:
  toolsnet:
    driver: bridge
  expense-tracker:
    external: true
    name: expense-tracker_default
