services:
  tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: devstrand-tools:local
    # Local access only; public traffic comes via Cloudflare Tunnel
    ports:
      - "8080:8080"
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_COMPRESS_MB: "100"
      TOOLS_TMP: /tmp/devstrand-tools
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      EMAIL_MAX_MB: ${EMAIL_MAX_MB:-20}
      SHARE_MAX_MB: ${SHARE_MAX_MB:-50}
      SHARE_RATE_LIMIT: ${SHARE_RATE_LIMIT:-20}
    volumes:
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
    networks:
      - toolsnet

  # Exposes tools.devstrand.com without a static IP or open ports.
  # Requires CLOUDFLARE_TUNNEL_TOKEN in tools/.env
  #
  # Cloudflare Public Hostname must be:
  #   Type: HTTP
  #   URL:  http://host.docker.internal:8080
  # Do NOT use https:// or the hostname "tools" unless cloudflared is
  # started by this compose file on toolsnet.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in tools/.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tools
    networks:
      - toolsnet

networks:
  toolsnet:
    driver: bridge
